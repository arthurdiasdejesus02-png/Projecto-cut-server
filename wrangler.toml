name = "projecto-cut-server"
main = "src/index.js"
compatibility_date = "2026-11-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/ws", "/social", "/health", "/region-probe", "/admin/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialHub"

[[durable_objects.bindings]]
name = "PROBES"
class_name = "RegionProbe"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "SocialHub", "RegionProbe"]
